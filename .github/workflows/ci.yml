name: Go verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
      FRAUD_POSTGRES_CACHE: ${{ runner.temp }}/fraud-postgres-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true
      - name: Formatting
        run: test -z "$(gofmt -l .)"
      - name: Build and vet
        run: |
          go build ./...
          go vet ./...
      - name: Race tests including real embedded PostgreSQL
        run: go test -p 2 ./... -race -count=1 -coverprofile=coverage.out
      - name: Coverage summary and weighted gates
        run: |
          go tool cover -func=coverage.out
          bash scripts/check-coverage.sh coverage.out
      - name: Dependency hygiene
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
