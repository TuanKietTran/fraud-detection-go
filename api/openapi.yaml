openapi: 3.0.3
info:
  title: Fraud Detection API
  version: 1.0.0
  description: All API responses carry a server-generated X-Request-ID. Errors are JSON envelopes with the same request_id. Write bodies are limited to 1048576 bytes and exactly one JSON value. Legacy replay/feedback conflicts remain HTTP 400.
servers:
  - url: http://localhost:8103
paths:
  /healthz:
    get:
      summary: Process liveness
      responses:
        '200': {description: Process is serving}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /readyz:
    get:
      summary: Readiness probes the selected event repository
      responses:
        '200': {description: Event store is ready}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /metrics:
    get:
      summary: JSON counters requests_total and failures_total (HTTP 5xx)
      responses:
        '200': {description: Process-local counters including the metrics request}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/score:
    post:
      operationId: scoreEvent
      summary: Score a synthetic transaction event (implemented)
      description: Runtime listens at HTTP_ADDR (default :8103). DATABASE_URL selects durable PostgreSQL state; unset uses process-memory state. REQUEST_TIMEOUT defaults to 5s, STARTUP_TIMEOUT and SHUTDOWN_TIMEOUT to 10s (all positive, at most 1m). Exact decimal amount is parsed directly from JSON text. In-process replay returns identical results for identical event_id/payload and rejects changed payloads. Velocity counts prior unique account events in the last 60 seconds (exclusive lower boundary); replay never increments it. Legacy recent_count can raise but cannot lower the internal count. Memory state is lost at restart; PostgreSQL state is retained but serialized as one full-history snapshot.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ScoreRequest'}
            example: {event_id: evt-001, account: acct-001, amount: '125.50', currency: USD}
      responses:
        '200':
          description: Deterministic scoring result; BLOCK is a legacy alias of DENY.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ScoreResponse'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '408': {$ref: '#/components/responses/Timeout'}
        '413': {$ref: '#/components/responses/TooLarge'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/events/{event_id}/explanation:
    get:
      operationId: getExplanation
      summary: Get stored scoring explanation (implemented)
      parameters:
        - {in: path, name: event_id, required: true, schema: {type: string}}
      responses:
        '200':
          description: Original stored decision and named reasons; DENY is canonical here (POST score retains the BLOCK alias).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExplanationResponse'}
        '404': {$ref: '#/components/responses/NotFound'}
        '408': {$ref: '#/components/responses/Timeout'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/rules:
    get:
      operationId: getRules
      summary: Get active rule configuration (implemented, including learned ReviewAt)
      responses:
        '200':
          description: Current active rules. Existing PascalCase field names are retained; this is a read-only surface, not a rule-edit API.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RuleConfig'}
        '408': {$ref: '#/components/responses/Timeout'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/feedback:
    post:
      operationId: submitFeedback
      summary: Submit a feedback label (implemented, deterministic threshold adjustment)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FeedbackRequest'}
      responses:
        '202': {description: Feedback applied or identical label replayed; response body is empty.}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '408': {$ref: '#/components/responses/Timeout'}
        '413': {$ref: '#/components/responses/TooLarge'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
components:
  responses:
    InvalidRequest:
      description: Invalid JSON/fields, missing feedback event, or legacy payload conflict (400, not 409).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotFound:
      description: Event not found.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Timeout:
      description: Request canceled or timed out.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    TooLarge:
      description: Request body exceeds 1048576 bytes.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    InternalError:
      description: Recovered internal panic; no sensitive details exposed.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unavailable:
      description: Scoring repository unavailable or bounded server response deadline exceeded (retry with the original event identity).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [error, request_id]
      properties:
        request_id: {type: string, minLength: 1, description: Server-generated identifier also returned in X-Request-ID.}
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: {type: string, minLength: 1}
            message: {type: string, minLength: 1}
    ScoreRequest:
      type: object
      required: [event_id, account, amount, currency]
      properties:
        event_id: {type: string, minLength: 1}
        account: {type: string, minLength: 1}
        amount:
          type: string
          pattern: '^(0|[1-9][0-9]*)(\.[0-9]{1,2})?$'
          description: Exact decimal amount; USD scale 2. Transitional numeric JSON tokens are parsed directly as decimal text.
        currency: {type: string, enum: [USD]}
        recent_count: {type: integer, minimum: 0, description: Legacy caller signal; effective velocity is the maximum of this and the internally accumulated account count.}
        geo_mismatch: {type: boolean}
        device_mismatch: {type: boolean}
        new_payee: {type: boolean}
        structuring: {type: boolean, description: 'Legacy additive signal. Independently, the third unique same-account event in the active window is inferred as structuring when it and at least two prior amounts lie within the inclusive top 10% of StructuringBandCents. False cannot suppress inference.'}
    ScoreResponse:
      type: object
      additionalProperties: false
      required: [event_id, score, decision, reasons]
      properties:
        event_id: {type: string, minLength: 1}
        score: {type: integer, minimum: 0, maximum: 100}
        decision: {type: string, enum: [ALLOW, REVIEW, DENY, BLOCK]}
        reasons: {$ref: '#/components/schemas/Reasons'}
    ExplanationResponse:
      type: object
      additionalProperties: false
      required: [event_id, score, decision, reasons]
      properties:
        event_id: {type: string, minLength: 1}
        score: {type: integer, minimum: 0, maximum: 100}
        decision: {type: string, enum: [ALLOW, REVIEW, DENY]}
        reasons: {$ref: '#/components/schemas/Reasons'}
    Reasons:
      type: array
      items:
        type: string
        enum: [HIGH_AMOUNT, VERY_HIGH_AMOUNT, ACCOUNT_VELOCITY, GEO_MISMATCH, DEVICE_MISMATCH, NEW_PAYEE, STRUCTURING]
    RuleConfig:
      type: object
      additionalProperties: false
      description: Existing PascalCase serialization. ReviewAt must be <=DenyAt and VeryHighAmountCents >=HighAmountCents; these cross-field invariants are enforced by domain validation. Executable seeds defaults; feedback changes only ReviewAt.
      required: [ReviewAt, DenyAt, HighAmountCents, VeryHighAmountCents, HighAmountWeight, VeryHighAmountWeight, VelocityLimit, VelocityWeight, GeoMismatchWeight, DeviceMismatchWeight, NewPayeeWeight, StructuringWeight, StructuringBandCents]
      properties:
        ReviewAt: {type: integer, minimum: 1, maximum: 100}
        DenyAt: {type: integer, minimum: 1, maximum: 100}
        HighAmountCents: {type: integer, format: int64, minimum: 0}
        VeryHighAmountCents: {type: integer, format: int64, minimum: 0}
        HighAmountWeight: {type: integer, minimum: 0, maximum: 100}
        VeryHighAmountWeight: {type: integer, minimum: 0, maximum: 100}
        VelocityLimit: {type: integer, minimum: 1}
        VelocityWeight: {type: integer, minimum: 0, maximum: 100}
        GeoMismatchWeight: {type: integer, minimum: 0, maximum: 100}
        DeviceMismatchWeight: {type: integer, minimum: 0, maximum: 100}
        NewPayeeWeight: {type: integer, minimum: 0, maximum: 100}
        StructuringWeight: {type: integer, minimum: 0, maximum: 100}
        StructuringBandCents: {type: integer, format: int64, minimum: 1}
    FeedbackRequest:
      type: object
      required: [event_id, label]
      properties:
        event_id: {type: string}
        label: {type: string, enum: [CONFIRMED_FRAUD, FALSE_POSITIVE]}
